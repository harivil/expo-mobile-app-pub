# The counter journey on iOS and Android: count up, count back down, reset.
#
# Run:  maestro test -e APP_ID=<your.bundle.id> .maestro/counter.yaml
# CI:   .eas/workflows/e2e.yml runs the smoke flow; add this one there when it is green.
#
# Every step addresses a `testID` from src/screens/counter/index.tsx — `counter-screen`,
# `counter-value`, `counter-increase`, `counter-decrease`, `counter-reset`. A testID becomes
# accessibilityIdentifier on iOS and resource-id on Android, so the same ids serve
# e2e/web/counter.spec.ts.
#
# The value assertions read the counter's own number, which is data rather than copy — a
# wording change cannot break them.
#
# They assert "Count: N" rather than a bare "N" because `counter-value` carries
# accessibilityLabel={`Count: ${count}`}. On iOS that label REPLACES the name derived from the
# element's children, so the accessibility hierarchy Maestro reads exposes only "Count: 0" —
# and `text:` is a whole-string regex, so a bare "0" matches nothing and the flow fails on iOS
# while passing on Android, where the TextView keeps its own text. Change this string and the
# accessibilityLabel together.
#
# NOT YET RUN on a device from this repo: Maestro is not installed here and Windows has no iOS
# simulator. The disabled-at-zero states are covered by the Jest and Playwright layers instead;
# this flow covers the taps.

appId: ${APP_ID}
---
- launchApp:
    clearState: true

- assertVisible:
    id: "counter-screen"

- assertVisible:
    id: "counter-value"
    text: "Count: 0"

- tapOn:
    id: "counter-increase"
- tapOn:
    id: "counter-increase"
- assertVisible:
    id: "counter-value"
    text: "Count: 2"

- tapOn:
    id: "counter-decrease"
- assertVisible:
    id: "counter-value"
    text: "Count: 1"

- tapOn:
    id: "counter-reset"
- assertVisible:
    id: "counter-value"
    text: "Count: 0"
