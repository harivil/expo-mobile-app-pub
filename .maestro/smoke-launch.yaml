# Smoke: the app launches, shows its first screen, and responds to a tap.
#
# The cheapest flow that catches the most expensive failure — a build that installs and then
# dies on launch. Keep it fast and keep it passing; everything else is allowed to be slower.
#
# Run:  maestro test -e APP_ID=<your.bundle.id> .maestro/smoke-launch.yaml
# CI:   .eas/workflows/e2e.yml passes APP_ID from the build, in both test_android and test_ios.
#       test_ios is what covers iOS for teammates on Windows, so this file is load-bearing for
#       the whole team rather than for one feature.
#
# The ids are real: `counter-screen` and `counter-value` come from <Screen testID> and the value
# in src/screens/counter/index.tsx, `counter-increase` from the Button there. A testID becomes
# accessibilityIdentifier on iOS and resource-id on Android, so one prop serves this flow and
# the Playwright one in e2e/web/.
#
# History, because it explains the shape: this flow once asserted `home-screen`, `tab-explore` and
# `explore-screen` from a src/app/(tabs)/_layout.tsx that had never been written, and claimed a web
# counterpart in e2e/web/ passed when that directory did not exist. It was rewritten onto the
# single counter route that did exist. A `(tabs)` group now genuinely exists, with Counter and
# Profile — so the tab assertion below is real rather than aspirational.
#
# It stays a SMOKE test: one tab assertion, not a journey. This file runs in both `test_android`
# and `test_ios`, so it is the team's only native coverage; the journeys live in
# .maestro/counter.yaml and .maestro/profile.yaml.
#
# NOT YET RUN on a device from this repo — Maestro is not installed here and Windows has no iOS
# simulator. e2e/web/counter.spec.ts passes against the same ids, which proves they resolve on
# web; the native run is what .eas/workflows/e2e.yml covers.

appId: ${APP_ID}
---
- launchApp:
    clearState: true

# Assert on a testID rather than on copy — a wording change should not fail a smoke test.
- assertVisible:
    id: "counter-screen"

- assertVisible:
    id: "counter-value"
    text: "Count: 0"

# Prove the app is interactive, not just painted.
- tapOn:
    id: "counter-increase"
- assertVisible:
    id: "counter-value"
    text: "Count: 1"

# The second tab exists and is reachable. One assertion — the journey is in profile.yaml.
- assertVisible:
    id: "tab-profile"
